name: ROAM production smoke test
on:
  workflow_dispatch:
  schedule:
    - cron: "15 12 * * *"
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public ROAM endpoints
        run: npm run test:smoke
